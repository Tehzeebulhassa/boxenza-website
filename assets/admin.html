<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16224A">
<title>Boxenza Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #16224A; --navy-2: #22305F; --accent: #D21F66; --accent-ink: #B0144F; --accent-soft: #FCE8F0; --kraft: #C9A06B;
  --bg: #F4F5F9; --card: #FFFFFF; --ink: #141A33; --ink-2: #5A6178; --line: #E2E5EE; --soft: #F7F8FB;
  --good: #137A4B; --good-soft: #E3F5EC; --warn: #8A5A00; --warn-soft: #FFF3D6; --info: #0B5CAD; --info-soft: #E2EFFD;
  --bad: #B3261E; --bad-soft: #FDE8E7; --mute: #5F6473; --mute-soft: #EEEFF3; --teal: #0F6E74; --teal-soft: #DDF3F3;
  --violet: #5B3CC4; --violet-soft: #ECE7FC;
  --f: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px; --nav-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.5 var(--f); color: var(--ink); background: var(--bg); }
a { color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; line-height: 1.2; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar + nav ---------- */
.top { position: sticky; top: 0; z-index: 30; background: var(--navy); color: #fff; }
.top-in { max-width: 1240px; margin: 0 auto; padding: 0.7rem 1rem; display: flex; align-items: center; gap: 1rem; }
.brand { display: flex; align-items: center; gap: 0.55rem; font-weight: 800; font-size: 1.05rem; text-decoration: none; }
.brand small { font: 500 0.68rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--kraft); }
.top-links { margin-left: auto; display: flex; gap: 0.4rem; }
.top-links a, .top-links button { background: none; border: 1px solid rgba(255,255,255,0.22); color: #fff; border-radius: 8px; padding: 0.35rem 0.7rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; }
.nav { display: flex; gap: 0.25rem; max-width: 1240px; margin: 0 auto; padding: 0 0.6rem; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { display: flex; align-items: center; gap: 0.45rem; padding: 0.7rem 0.85rem; color: rgba(255,255,255,0.72); text-decoration: none; font-weight: 600; font-size: 0.92rem; border-bottom: 3px solid transparent; white-space: nowrap; }
.nav a[aria-current="page"] { color: #fff; border-bottom-color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .badge { background: var(--accent); color: #fff; border-radius: 99px; font-size: 0.7rem; padding: 0 0.4rem; min-width: 1.2rem; text-align: center; }
@media (max-width: 760px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--line); justify-content: space-around; padding: 0 0 env(safe-area-inset-bottom); max-width: none; box-shadow: 0 -4px 16px rgba(20,26,51,0.06); }
  .nav a { flex-direction: column; gap: 0.15rem; color: var(--ink-2); font-size: 0.7rem; padding: 0.5rem 0.2rem 0.45rem; border-bottom: 0; border-top: 3px solid transparent; flex: 1; justify-content: center; position: relative; }
  .nav a[aria-current="page"] { color: var(--accent-ink); border-top-color: var(--accent); }
  .nav svg { width: 22px; height: 22px; }
  .nav .badge { position: absolute; top: 4px; left: calc(50% + 6px); }
  main { padding-bottom: calc(var(--nav-h) + 1.5rem + env(safe-area-inset-bottom)) !important; }
  .top-links .hide-sm { display: none; }
}

/* ---------- layout ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
.page-head h1 { font-size: 1.45rem; font-weight: 800; }
.muted { color: var(--ink-2); font-size: 0.88rem; }
.eyebrow { font: 500 0.7rem/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem; }
.grid { display: grid; gap: 0.75rem; }
.cols-2 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); align-items: start; }
.fgrid.tight { grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); }

/* ---------- buttons + forms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 9px; padding: 0.55rem 0.95rem; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 40px; }
.btn:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink-2); }
.btn.danger { background: #fff; color: var(--bad); border-color: #F2C4C1; }
.btn.small { min-height: 32px; padding: 0.3rem 0.65rem; font-size: 0.82rem; }
.btn[disabled] { opacity: 0.6; cursor: progress; }
.btn svg { width: 16px; height: 16px; }
label.f { display: grid; gap: 0.3rem; font-size: 0.8rem; font-weight: 700; color: var(--ink-2); min-width: 0; }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 0.55rem 0.7rem; background: #fff; font-size: 0.95rem; font-weight: 500; color: var(--ink); min-height: 42px; }
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fgrid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); }
.fgrid .wide { grid-column: 1 / -1; }
.money { display: grid; grid-template-columns: 6.2rem 1fr; gap: 0.4rem; }
.check { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.9rem; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 0.35rem 0.75rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.chip b { font-weight: 800; color: var(--ink); }
.chip[aria-pressed="true"], .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip[aria-pressed="true"] b, .chip.on b { color: #fff; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
.toolbar .search { flex: 1 1 14rem; min-width: 0; }
.scroll-x { overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.chips.scroll-x { flex-wrap: nowrap; padding-bottom: 0.2rem; }

/* ---------- pills ---------- */
.pill { display: inline-block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.18rem 0.55rem; border-radius: 99px; white-space: nowrap; }
.st-new { background: var(--accent-soft); color: var(--accent-ink); }
.st-contacted { background: var(--info-soft); color: var(--info); }
.st-quoted { background: var(--warn-soft); color: var(--warn); }
.st-won, .sg-delivered { background: var(--good-soft); color: var(--good); }
.st-lost, .sg-cancelled { background: var(--mute-soft); color: var(--mute); }
.sg-artwork { background: var(--violet-soft); color: var(--violet); }
.sg-sample { background: var(--warn-soft); color: var(--warn); }
.sg-production { background: var(--info-soft); color: var(--info); }
.sg-shipping { background: var(--teal-soft); color: var(--teal); }
.tag-due { color: var(--bad); font-weight: 700; }
.tag-ok { color: var(--good); font-weight: 700; }

/* ---------- list items ---------- */
.list { display: grid; gap: 0.6rem; }
.item { display: grid; gap: 0.25rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0.85rem 1rem; text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s; min-width: 0; }
.item:hover { border-color: #C8CDDB; box-shadow: 0 2px 10px rgba(20,26,51,0.06); }
.item-top { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
.ref { font: 500 0.78rem var(--mono); color: var(--ink-2); }
.item-title { font-weight: 700; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { color: var(--ink-2); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-meta { display: flex; flex-wrap: wrap; gap: 0.25rem 0.9rem; font-size: 0.82rem; color: var(--ink-2); }
.item-meta b { color: var(--ink); }
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--ink-2); background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 0.6rem; justify-items: center; }
.more { display: flex; justify-content: center; margin-top: 0.75rem; }

/* ---------- dashboard ---------- */
.kpis { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5rem), 1fr)); margin-bottom: 1rem; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0.85rem 1rem; display: grid; gap: 0.15rem; text-decoration: none; }
.kpi span { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.kpi b { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 0.78rem; color: var(--ink-2); }
.kpi.hot b { color: var(--accent-ink); }
.kpi.good b { color: var(--good); }
.sec-title { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.6rem; }
.sec-title h2 { font-size: 1.02rem; font-weight: 800; }
.sec-title a { font-size: 0.85rem; font-weight: 700; color: var(--accent-ink); text-decoration: none; }
.rows { display: grid; }
.rowlink { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.6rem 0; border-top: 1px solid var(--line); text-decoration: none; min-width: 0; }
.rowlink:first-child { border-top: 0; }
.rowlink > div { min-width: 0; }
.rowlink b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; }
.stagebar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--mute-soft); margin: 0.4rem 0 0.75rem; }
.stagebar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- drawer ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,26,51,0.38); z-index: 50; opacity: 0; transition: opacity 0.2s; }
.overlay.on { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--bg); z-index: 60; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.22s ease; box-shadow: -10px 0 30px rgba(20,26,51,0.15); }
.drawer.on { transform: none; }
.dr-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; padding: 1rem 1.1rem 0.85rem; background: #fff; border-bottom: 1px solid var(--line); }
.dr-head h2 { font-size: 1.2rem; font-weight: 800; overflow-wrap: anywhere; }
.dr-x { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; text-decoration: none; font-size: 1.4rem; line-height: 1; }
.dr-body { overflow-y: auto; padding: 1rem 1.1rem calc(2rem + env(safe-area-inset-bottom)); display: grid; gap: 1rem; align-content: start; -webkit-overflow-scrolling: touch; }
.dr-sec { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 1rem; display: grid; gap: 0.75rem; }
.dr-sec h3 { font-size: 0.95rem; font-weight: 800; }
.quick { display: flex; flex-wrap: wrap; gap: 0.5rem; }
dl.kv { display: grid; grid-template-columns: minmax(7rem, max-content) 1fr; gap: 0.4rem 1rem; margin: 0; font-size: 0.9rem; }
dl.kv dt { color: var(--ink-2); font-weight: 600; }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
pre.sum { white-space: pre-wrap; background: var(--soft); border: 1px solid var(--line); padding: 0.75rem; border-radius: 9px; font: 0.82rem/1.55 var(--mono); margin: 0; overflow-wrap: anywhere; }
.timeline { display: grid; gap: 0.1rem; }
.tl { display: grid; grid-template-columns: 10px 1fr; gap: 0.7rem; padding: 0.35rem 0; }
.tl i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); margin-top: 0.4rem; }
.tl:first-child i { background: var(--accent); }
.tl b { font-weight: 600; font-size: 0.9rem; display: block; overflow-wrap: anywhere; }
.tl span { font-size: 0.78rem; color: var(--ink-2); }
.note-form { display: flex; gap: 0.5rem; }
.note-form input { flex: 1; min-width: 0; }
.stepper { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.6rem; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem; }
.calc div { display: grid; }
.calc span { font-size: 0.75rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
.calc b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.calc b.neg { color: var(--bad); } .calc b.pos { color: var(--good); }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: space-between; align-items: center; }
.form-msg { font-size: 0.85rem; font-weight: 600; }
.form-msg.err { color: var(--bad); } .form-msg.ok { color: var(--good); }
.stars { color: var(--kraft); letter-spacing: 0.05em; }

/* ---------- tables ---------- */
table.t { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 760px; }
table.t th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); font-weight: 700; padding: 0.55rem 0.7rem; background: var(--soft); border-bottom: 1px solid var(--line); position: sticky; top: 0; white-space: nowrap; }
table.t td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td:first-child { min-width: 13rem; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.best td { background: #F1FAF5; }
table.t tr.grp td { border-top: 2px solid var(--line); }
.best-tag { display: inline-block; margin-left: 0.35rem; font-size: 0.65rem; font-weight: 800; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 0.05rem 0.4rem; text-transform: uppercase; vertical-align: middle; }
.tbl-wrap { background: #fff; border: 1px solid var(--line); border-radius: var(--r); max-height: 70vh; }

/* ---------- login + toast + loading ---------- */
.login { max-width: 380px; margin: 9vh auto 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 1.75rem; display: grid; gap: 0.9rem; box-shadow: 0 10px 40px rgba(20,26,51,0.08); }
.login h1 { font-size: 1.35rem; font-weight: 800; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 1rem + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 0.7rem 1.1rem; border-radius: 10px; font-weight: 600; font-size: 0.9rem; z-index: 90; opacity: 0; transition: 0.2s; pointer-events: none; max-width: calc(100% - 2rem); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.toast.err { background: var(--bad); }
@media (min-width: 761px) { .toast { bottom: 1.5rem; } }
.loading { padding: 2rem; text-align: center; color: var(--ink-2); }
.spin { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.7s linear infinite; vertical-align: middle; margin-right: 0.4rem; }
@keyframes sp { to { transform: rotate(360deg); } }
.preview-tbl { max-height: 260px; }
.preview-tbl table.t { min-width: 560px; }
@media (prefers-reduced-motion: reduce) { .drawer, .overlay, .toast { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/home"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 24 8.5v11L14 25 4 19.5v-11Z" fill="#D21F66"/><path d="M4 8.5 14 14l10-5.5M14 14v11" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Boxenza <small>Admin</small></span></a>
    <div class="top-links" id="top-links" hidden>
      <a href="/" target="_blank" rel="noopener" class="hide-sm">View site</a>
      <button type="button" id="logout">Log out</button>
    </div>
  </div>
  <nav class="nav" id="nav" hidden aria-label="Admin sections">
    <a href="#/home" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/quotes" data-v="quotes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H7l-3 3z"/><path d="M8 9h8M8 12h5"/></svg>Quotes<span class="badge" id="badge-new" hidden></span></a>
    <a href="#/orders" data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></svg>Orders</a>
    <a href="#/suppliers" data-v="suppliers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l6 4V9l6 4V5l6 4v12z"/><path d="M7 17h2M12 17h2M17 17h1"/></svg>Suppliers</a>
    <a href="#/rates" data-v="rates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/></svg>Rates</a>
  </nav>
</header>

<main id="main">
  <form class="login" id="login" hidden>
    <div><p class="eyebrow">Boxenza</p><h1>Admin login</h1></div>
    <label class="f">Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="login-btn">Log in</button>
    <p class="form-msg err" id="login-err" role="alert"></p>
  </form>
  <div id="view"></div>
</main>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="dr-title"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>window.BX_CATS = /*BX_CATS*/[];</script>
<script>
(function () {
  'use strict';
  // ---------------- basics ----------------
  var STATUS = ['new', 'contacted', 'quoted', 'won', 'lost'];
  var STAGES = ['artwork', 'sample', 'production', 'shipping', 'delivered', 'cancelled'];
  var STAGE_COLOR = { artwork: '#5B3CC4', sample: '#D49A1A', production: '#0B5CAD', shipping: '#0F8A91', delivered: '#137A4B', cancelled: '#A7ABB8' };
  var CURRENCIES = ['USD', 'GBP', 'EUR', 'CAD', 'AUD', 'AED', 'SAR', 'PKR'];
  var QTYS = [100, 250, 500, 1000, 2500, 5000, 10000];
  var CATS = window.BX_CATS || [];
  var S = { token: null, view: null, f: { quotes: { status: '', q: '' }, orders: { stage: 'open', q: '' }, suppliers: { q: '' }, rates: { supplier_id: '', category: '', qty: '', material: '', q: '' } }, suppliers: null };

  // ===== Rate sheet import (reads the Excel sheets we give suppliers) =====
  var xlsxLoading = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    if (xlsxLoading) return xlsxLoading;
    xlsxLoading = new Promise(function (ok, no) { var sc = document.createElement('script'); sc.src = '/assets/vendor/xlsx.full.min.js'; sc.onload = ok; sc.onerror = function () { xlsxLoading = null; no(new Error('Could not load the Excel reader. Check your connection.')); }; document.head.appendChild(sc); });
    return xlsxLoading;
  }
  function toNum(v) { if (typeof v === 'number') return v; var m = String(v == null ? '' : v).replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
  function parseWorkbook(wb) {
    var out = [], sheets = [];
    wb.SheetNames.forEach(function (name) {
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true });
      var hi = -1;
      for (var i = 0; i < Math.min(rows.length, 20); i++) { var r = (rows[i] || []).map(function (x) { return String(x == null ? '' : x).trim(); }); if (r.indexOf('Code') >= 0 && r.indexOf('Style') >= 0) { hi = i; break; } }
      if (hi < 0) return;
      var H = rows[hi].map(function (x) { return String(x == null ? '' : x).trim(); });
      var col = function (test) { for (var k = 0; k < H.length; k++) if (test(H[k].toLowerCase())) return k; return -1; };
      var c = { code: H.indexOf('Code'), style: H.indexOf('Style'), size: col(function (h) { return h === 'size'; }), L: col(function (h) { return /^length.*\(in\)/.test(h); }), W: col(function (h) { return /^width.*\(in\)/.test(h); }), D: col(function (h) { return /^(depth|height).*\(in\)/.test(h); }),
        moq: col(function (h) { return h.indexOf('moq') >= 0; }), sample: col(function (h) { return h.indexOf('sample') >= 0; }), days: col(function (h) { return h.indexOf('din') >= 0 || h.indexOf('days') >= 0 || h.indexOf('production') >= 0; }), note: col(function (h) { return h.indexOf('note') >= 0; }) };
      var rateCols = [];
      H.forEach(function (h, k) { var m = h.match(/^(.*?)@\s*([\d,]+)/); if (m) { var mat = m[1].replace(/rate/i, '').trim(); rateCols.push({ k: k, qty: parseInt(m[2].replace(/,/g, ''), 10), material: mat }); } });
      var t = rows[0] && rows[0][0] ? String(rows[0][0]) : '';
      var category = t.indexOf(' – ') > 0 ? t.split(' – ')[0].trim() : (t.indexOf(' - ') > 0 ? t.split(' - ')[0].trim() : name);
      var count = 0, filled = 0;
      for (var j = hi + 1; j < rows.length; j++) {
        var row = rows[j] || [], code = row[c.code];
        if (code == null || String(code).trim() === '') break; // the options block starts after a blank row
        count++;
        rateCols.forEach(function (rc) {
          var val = toNum(row[rc.k]);
          if (!isFinite(val) || val <= 0) return;
          filled++;
          out.push({ category: category, style_code: String(code).trim(), style: row[c.style], size_name: c.size >= 0 ? row[c.size] : null,
            length: c.L >= 0 && isFinite(toNum(row[c.L])) ? toNum(row[c.L]) : null, width: c.W >= 0 && isFinite(toNum(row[c.W])) ? toNum(row[c.W]) : null, depth: c.D >= 0 && isFinite(toNum(row[c.D])) ? toNum(row[c.D]) : null,
            unit: 'in', material: rc.material || null, qty: rc.qty, rate_pkr: val,
            moq: c.moq >= 0 && isFinite(toNum(row[c.moq])) ? Math.round(toNum(row[c.moq])) : null, sample_cost_pkr: c.sample >= 0 && isFinite(toNum(row[c.sample])) ? toNum(row[c.sample]) : null,
            lead_days: c.days >= 0 && isFinite(toNum(row[c.days])) ? Math.round(toNum(row[c.days])) : null, note: c.note >= 0 && row[c.note] != null ? String(row[c.note]).slice(0, 300) : null });
        });
      }
      sheets.push({ name: category, sizes: count, rates: filled, rateCols: rateCols.length });
    });
    return { rows: out, sheets: sheets };
  }
  function importer(box, supplierId, done) {
    box.innerHTML = '<div class="grid" style="margin-top:0.25rem"><label class="f">Filled rate sheet (.xlsx)<input type="file" id="imp-file" accept=".xlsx,.xls,.xlsm"></label><p class="muted" id="imp-msg">Only the yellow rate cells with a number are imported. Empty cells are skipped.</p><div id="imp-prev"></div></div>';

          '<div class="tbl-wrap scroll-x preview-tbl" style="margin-top:0.6rem"><table class="t"><thead><tr><th>Style</th><th>Size</th><th>Material</th><th class="num">Qty</th><th class="num">Rate PKR</th></tr></thead><tbody>' +
          res.rows.slice(0, 12).map(function (r) { return '<tr><td>' + esc(r.style_code + ' ' + r.style) + '</td><td>' + esc(r.size_name || '') + '</td><td>' + esc(r.material || 'Default') + '</td><td class="num">' + num(r.qty, 0) + '</td><td class="num">' + num(r.rate_pkr) + '</td></tr>'; }).join('') +

          '<div class="actions" style="margin-top:0.6rem"><span class="muted">Saved as one import, so you can remove it later.</span><button class="btn" type="button" id="imp-save">Save ' + num(res.rows.length, 0) + ' rates</button></div>';
        $('imp-save').addEventListener('click', function () {
          var btn = this, batch = file.name.replace(/\.[^.]+$/, '').slice(0, 50) + ' · ' + todayStr() + ' ' + Date.now().toString(36).slice(-4);

            .then(function () { S.suppliers = null; toast(saved + ' rates saved' + (skipped ? ', ' + skipped + ' skipped' : '')); done && done(); })
            .catch(function (er) { busy(btn, false); toast(er.message + (saved ? ' (' + saved + ' were saved)' : ''), true); });
        });

    });
  }

  // ---------------- router ----------------
  function debounce(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; }

  function route() {
    if (!S.token) return showLogin();
    var raw = location.hash.replace(/^#\/?/, ''), qi = raw.indexOf('?');
    var path = (qi >= 0 ? raw.slice(0, qi) : raw).split('/'), params = {};
    if (qi >= 0) raw.slice(qi + 1).split('&').forEach(function (p) { var kv = p.split('='); params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); });
    var v = V[path[0]] ? path[0] : 'home', id = path[1];
    if (qi >= 0) {
      if (v === 'quotes') S.f.quotes = { status: params.status || '', follow: params.follow || '', q: '' };
      if (v === 'orders') S.f.orders = { stage: params.stage || 'open', q: '' };
      history.replaceState(null, '', '#/' + v); S.view = null; $('view').innerHTML = '';
    }
    document.querySelectorAll('#nav a').forEach(function (a) { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (S.view !== v) { S.view = v; window.scrollTo(0, 0); V[v].list(); }
    if (id && V[v].open) V[v].open(id); else closeDrawer();
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-retry]'); if (b) { if (b.closest('#drawer')) route(); else { S.view = null; route(); } } });

  // ---------------- login ----------------
  function showLogin() {
    $('login').hidden = false; $('view').innerHTML = ''; $('nav').hidden = true; $('top-links').hidden = true; closeDrawer();
    setTimeout(function () { $('pw').focus(); }, 50);
  }
  function logout(expired) {
    S.token = null; S.view = null; S.suppliers = null; storage.del('bx_admin_token');
    showLogin(); if (expired) $('login-err').textContent = 'Your session ended. Please log in again.';
  }
  $('logout').addEventListener('click', function () { logout(false); });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault(); var btn = $('login-btn'); busy(btn, true, 'Checking…'); $('login-err').textContent = '';
    api('POST', 'login', null, { password: $('pw').value }).then(function (j) {
      busy(btn, false); S.token = j.token; storage.set('bx_admin_token', j.token); $('pw').value = '';
      start();
    }).catch(function (er) { busy(btn, false); $('login-err').textContent = er.message; $('pw').select(); });
  });
  function start() {
    $('login').hidden = true; $('nav').hidden = false; $('top-links').hidden = false; S.view = null;
    if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/home');
    route();
  }
  S.token = storage.get('bx_admin_token');
  if (S.token) {
    try { var p = JSON.parse(atob(S.token.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'))); if (!(p.exp > Date.now())) S.token = null; } catch (e) { S.token = null; }
  }
  if (S.token) start(); else showLogin();
})();
</script>
</body>
</html>
